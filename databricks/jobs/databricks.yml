# Databricks Asset Bundle — PI lakehouse jobs
# COMPUTE POLICY: use an existing classic cluster only.
# Do NOT use serverless compute, job clusters, or environment_key serverless specs.
# Fill existing_cluster_id + workspace host before any deploy (deploy is not done by default).

bundle:
  name: pi-databricks-lakehouse

variables:
  pi_api_base:
    description: Base URL for mock PI API reachable from cluster
    default: https://negligent-subsiding-habitat.ngrok-free.dev
  existing_cluster_id:
    description: Classic all-purpose cluster id (never serverless)
    # Single-node classic: vsingam@mhktechinc.com's Cluster 2026-08-11 06:19:00
    default: 0811-112417-qhhyebl0

resources:
  jobs:
    pi_bronze_stream:
      name: pi-bronze-timeseries-stream
      tasks:
        - task_key: bronze_pi_stream
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ../notebooks/01_bronze_pi_stream.py

    enrichment_and_curate:
      name: pi-enrichment-silver-gold
      tasks:
        - task_key: bronze_enrichment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ../notebooks/02_bronze_enrichment_batch.py
        - task_key: silver_gold
          depends_on:
            - task_key: bronze_enrichment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ../notebooks/03_silver_gold_transforms.py

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Azure Databricks workspace (managed RG: databricks-rg-vamshi-dev-npujx7didcsju)
      # Classic cluster pinned via var.existing_cluster_id. Do not bundle-deploy until you ask.
      host: https://adb-7405605697371162.2.azuredatabricks.net
